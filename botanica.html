        // BÚSQUEDA BLINDADA CONTRA ERRORES
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let rawId = params.get('id');

            // CORRECCIÓN: Si no hay ID o está vacío, asignamos por defecto la planta "1" (Almendro)
            if (!rawId || rawId.trim() === "") {
                rawId = "1";
            }

            const queryKey = rawId.toString().trim();

            const normalizeStr = (str) => {
                return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[-_\s]+/g, "").trim() : "";
            };

            const normalizedQuery = normalizeStr(queryKey);
            let item = null;
            const keys = Object.keys(botanicaDB);

            if (normalizedQuery) {
                let matchedKey = keys.find(k => normalizeStr(k) === normalizedQuery || normalizeStr(botanicaDB[k].name) === normalizedQuery);

                if (!matchedKey) {
                    matchedKey = keys.find(k => {
                        const obj = botanicaDB[k];
                        const nKey = normalizeStr(k);
                        const nName = normalizeStr(obj.name);
                        return nKey.includes(normalizedQuery) || normalizedQuery.includes(nKey) ||
                                     nName.includes(normalizedQuery) || normalizedQuery.includes(nName);
                    });
                }

                if (matchedKey) {
                    item = botanicaDB[matchedKey];
                }
            }

            const main = document.getElementById('main-content');

            if (!item) {
                main.innerHTML = `
                    <div class="bg-zinc-900 border border-red-500/30 rounded-3xl p-8 md:p-12 text-center space-y-6 max-w-xl mx-auto my-12 shadow-2xl">
                        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto text-2xl border border-red-500/20">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="space-y-2">
                            <h1 class="text-2xl md:text-3xl font-black uppercase text-white tracking-tight">Planta no encontrada</h1>
                            <p class="text-zinc-400 text-sm md:text-base leading-relaxed">
                                No se encontró el registro para <code class="text-science-neon font-mono bg-black/60 px-2 py-1 rounded border border-zinc-800">id=${rawId || '(vacío)'}</code>.
                            </p>
                        </div>
                        <div class="pt-2">
                            <a href="catalogo.html" class="inline-flex items-center gap-2 bg-white text-black font-bold text-xs uppercase tracking-widest px-6 py-3.5 rounded-2xl hover:bg-science-neon transition-colors shadow-lg">
                                <i class="fa-solid fa-arrow-left"></i> Volver al Catálogo
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            let imgList = item.images && Array.isArray(item.images) && item.images.length > 0 
                ? item.images.filter(img => img && img.trim() !== "") 
                : [];
            
            let primaryImg = imgList.length > 0 ? imgList[0] : '';

            let primaryDisplayHTML = primaryImg ? 
                `<img id="main-product-img" src="${primaryImg}" alt="${item.name}" class="w-full h-full object-cover transition-opacity duration-300" onerror="this.style.display='none'; document.getElementById('img-error-fallback').style.display='flex';">
                 <div id="img-error-fallback" style="display:none;" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-900 text-zinc-500 gap-2 p-4 text-center">
                    <i class="fa-solid fa-image-slash text-3xl text-zinc-600"></i>
                    <span class="text-xs font-mono">Imagen local no encontrada (${primaryImg})</span>
                 </div>` :
                `<div class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-900 text-zinc-500 gap-2 p-4 text-center">
                    <i class="fa-solid fa-image-slash text-3xl text-zinc-600"></i>
                    <span class="text-xs font-mono">Sin imagen asignada</span>
                 </div>`;

            let galleryHTML = '';
            if (imgList.length > 1) {
                galleryHTML = `<div class="grid grid-cols-3 gap-3 pt-3">` + 
                    imgList.map((img, index) => `
                        <div onclick="cambiarImagenPrincipal('${img}', this)" 
                             class="thumbnail-item rounded-2xl overflow-hidden border ${index === 0 ? 'border-science-neon ring-2 ring-science-neon/50' : 'border-zinc-800'} aspect-square bg-zinc-900 cursor-pointer transition-all hover:opacity-80 relative flex items-center justify-center">
                            <img src="${img}" class="w-full h-full object-cover" onerror="this.style.display='none';">
                        </div>
                    `).join('') +
                    `</div>`;
            }

            main.innerHTML = `
                <div class="space-y-3">
                    <h1 class="text-3xl md:text-5xl font-black uppercase text-white tracking-tight">
                        ${item.name}
                    </h1>
                    <p class="text-zinc-400 text-lg italic font-serif">
                        ${item.sciName}
                    </p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start pt-4">
                    <div class="space-y-3">
                        <div class="rounded-3xl overflow-hidden border border-zinc-800 bg-zinc-900 aspect-[4/3] shadow-2xl relative">
                            ${primaryDisplayHTML}
                        </div>
                        ${galleryHTML}
                    </div>

                    <div class="bg-zinc-900/80 border border-zinc-800 rounded-3xl p-6 md:p-8 space-y-6">
                        <h2 class="text-xl font-bold text-white border-b border-zinc-800 pb-3 flex items-center gap-2">
                            <i class="fa-solid fa-leaf text-science-neon"></i> Ficha Técnica Completa
                        </h2>

                        <p class="text-zinc-300 text-sm md:text-base font-light leading-relaxed">
                            ${item.desc}
                        </p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <div class="bg-black/50 p-4 rounded-2xl border border-zinc-800">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 block">Nombre Científico</span>
                                <span class="text-sm font-semibold text-white italic">${item.sciName}</span>
                            </div>
                            <div class="bg-black/50 p-4 rounded-2xl border border-zinc-800">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 block">Familia Botánica</span>
                                <span class="text-sm font-semibold text-white">${item.family}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        function cambiarImagenPrincipal(imgSrc, element) {
            const mainImg = document.getElementById('main-product-img');
            const fallback = document.getElementById('img-error-fallback');
            if (mainImg) {
                mainImg.style.opacity = '0';
                setTimeout(() => {
                    mainImg.src = imgSrc;
                    if(fallback) fallback.style.display = 'none';
                    mainImg.style.display = 'block';
                    mainImg.style.opacity = '1';
                }, 150);
            }

            const thumbnails = document.querySelectorAll('.thumbnail-item');
            thumbnails.forEach(thumb => {
                thumb.classList.remove('border-science-neon', 'ring-2', 'ring-science-neon/50');
                thumb.classList.add('border-zinc-800');
            });

            element.classList.remove('border-zinc-800');
            element.classList.add('border-science-neon', 'ring-2', 'ring-science-neon/50');
        }
    </script>
</body>
</html>
